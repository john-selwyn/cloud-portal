{% extends 'portal/base.html' %}{% block title %}Change password{% endblock %}{% block content %}
<section class="card auth"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change your password</h1>
<p>Your current password is required. Other signed-in sessions will need to sign in again.</p>
<form method="post" class="auth-form">{% csrf_token %}{{ form.as_p }}<button type="submit" class="wide">Update password</button></form>
<p><a href="{% url 'account' %}">Back to account</a></p></section>{% endblock %}
