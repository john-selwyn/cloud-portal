{% extends 'portal/base.html' %}{% block title %}Create account{% endblock %}{% block content %}
<section class="card auth">
<p class="eyebrow">WELCOME ABOARD</p>
<h1>Create your account</h1>
<p class="muted">Manage your services, orders and invoices with ICT Ventures Cloud Portal.</p>
<form method="post" class="auth-form">{% csrf_token %}{{ form.as_p }}<button type="submit" class="wide">Create account</button>
</form>

</section>{% endblock %}
